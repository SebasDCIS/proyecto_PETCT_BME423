# Configuración central del proyecto. Todo script lee de aquí para que
# "cambiar un número" ocurra en un solo lugar y quede en el historial de git.

proyecto: "Segmentación de lesiones FDG-PET/CT: fusión temprana vs intermedia con atención cruzada"
semilla: 423

datos:
  coleccion_tcia: "FDG-PET-CT-Lesions"
  n_positivos: 200
  n_negativos: 50
  particion: [0.7, 0.1, 0.2]     # train / val / test, por paciente
  raw: "data/raw"
  nifti: "data/interim/nifti"
  procesado: "data/processed"

preprocesamiento:
  espaciado_mm: [3.0, 3.0, 3.0]  # isotrópico; la propuesta declara 3 mm por cómputo
  ventana_hu: [-200, 300]        # tejido blando → [0, 1]
  suv_clip: [0, 30]              # SUV → [0, 1] con tope 30 (evita que la vejiga domine)
  parche: [96, 96, 96]
  prob_parche_con_lesion: 0.7    # muestreo sesgado a lesiones

referencia_clasica:
  umbral_suv: 2.5
  apertura_radio_vox: 1
  volumen_min_ml: 0.5

entrenamiento:
  iteraciones: 25000
  lote: 2
  lr: 3.0e-4
  weight_decay: 1.0e-5          # (informativo: TrainConfig lo fija; AdamW)
  precision_mixta: true         # solo actúa en CUDA; en mps/cpu se entrena en fp32
  checkpoint_cada: 500          # iteraciones; imprescindible en Colab
  validar_cada: 1000            # validación rápida (ventana deslizante sobre pocos estudios)
  max_estudios_val: 12          # cuántos estudios de validación usa la validación rápida

evaluacion:
  # métricas del reto autoPET (Dice solo en positivos; FPV/FNV por componentes 26-conexas)
  metricas: [dice, fpv_ml, fnv_ml, mtv_pred_ml, mtv_gt_ml, suvmax_pred, suvmax_gt]
  excluir_zona_borrada: true    # vóxeles con SUV = 0 (caja del defacing) fuera de pred y gt
  grupos_de_organos: "src/petct/organs.py::GROUPS"   # TotalSegmentator agrupado (Paso 5)
  bootstrap: 1000
